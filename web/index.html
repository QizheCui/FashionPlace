<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FashionPlace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brandmark">Fashion<em>Place</em></div>
    <nav class="tabs" role="tablist">
      <button data-tab="foryou" class="active">For You</button>
      <button data-tab="explore">Explore</button>
      <button data-tab="deals">Deals</button>
      <button data-tab="saved">Saved <span id="savedCount"></span></button>
    </nav>
    <select id="profilePick" aria-label="Profile"></select>
  </header>

  <section class="intro" id="intro"></section>

  <section class="controls" id="controls">
    <div class="chips" id="chips"></div>
    <label class="toggle"><input type="checkbox" id="underIdeal"> <span id="underIdealLabel">Under £200</span></label>
    <div class="slider" id="surpriseWrap" hidden>
      <span>Familiar</span>
      <input type="range" id="surprise" min="0" max="100" value="40">
      <span>Surprise me</span>
    </div>
  </section>

  <main id="grid" class="grid"></main>
  <p class="empty" id="empty" hidden></p>

  <footer class="foot" id="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
