# Deployed by Cloudflare Workers Builds from this folder on every push to main.
name = "atelier-one"
main = "live-search.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Cloudflare's built-in AI for the stylist (free daily allowance, no key)
[ai]
binding = "AI"

# Anonymous usage log (searches, clicks, errors). Created automatically on first deploy (free tier).
[[d1_databases]]
binding = "DB"
database_name = "atelier-one-events"
