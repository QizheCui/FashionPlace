name: Live site check (taste words & photos)
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "which checks (blank = words & photos, styles = style picks)"
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/e2e_taste.py
        env:
          RUNS: ${{ inputs.runs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e, path: e2e/ }
