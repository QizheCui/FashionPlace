name: Daily collect & publish

on:
  schedule:
    - cron: "17 5 * * *"   # every day ~05:17 UK time (UTC in winter)
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["web/**", "config/**", "collector/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  # code pushes deploy straight away instead of queueing behind a long nightly collection
  group: daily-${{ github.event_name == 'push' && 'push' || 'collect' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt open_clip_torch

      - name: Tests
        run: python -m pytest -q tests

      - name: Load yesterday's data (kept on the 'data' branch so main stays small)
        run: |
          rm -rf data
          git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/databranch \
            && cp -r /tmp/databranch/. data && rm -rf data/.git || mkdir -p data
          # the big files are stored compressed (GitHub refuses single files over 100 MB)
          for f in data/*.json.gz; do [ -e "$f" ] && gunzip -f "$f"; done
          ls data | head -20

      - name: Restore image-vector cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: vectors-${{ github.run_id }}
          restore-keys: vectors-

      - name: Collect catalogues
        # code/config pushes only rebuild the site; the brands' websites are visited once a day
        if: github.event_name != 'push'
        run: python -m collector.collect

      - name: Shop health alert
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/health_issue.py > /tmp/health.md || true
          if [ -s /tmp/health.md ]; then
            n=$(gh issue list --search "Shop health in:title" --state open --json number --jq '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body-file /tmp/health.md; else gh issue create --title "Shop health" --body-file /tmp/health.md; fi
          fi

      - name: Import affiliate feeds (if set up)
        if: github.event_name != 'push'
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: python -m collector.affiliate

      - name: Build style vectors (CLIP)
        run: python -m collector.embed

      - name: Restore fashion-model photo vectors
        uses: actions/cache/restore@v4
        with:
          path: .cache/fsl
          key: fsl-merged-none
          restore-keys: fsl-merged-

      - name: Build style vectors (fashion-trained model, side by side)
        # must never stop the normal site from publishing while this model is on trial
        continue-on-error: true
        env:
          EMBED_MODEL: fsl
          MAX_NEW_EMBED: ${{ github.event_name == 'push' && '300' || '8000' }}
        run: python -m collector.embed

      - name: Keep fashion-model photo vectors (nightly runs only, so a quick deploy can't replace a fuller set)
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: .cache/fsl
          key: fsl-merged-${{ github.run_id }}

      - name: Save data to the 'data' branch (replaced each day, so history doesn't pile up)
        run: |
          cd data
          git init -q -b data
          gzip -kf items.json price_history.json
          printf 'items.json\nprice_history.json\n' > .gitignore
          git add -A
          git -c user.name="fashionplace-bot" -c user.email="actions@users.noreply.github.com" commit -qm "data: refresh $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git .gitignore items.json.gz price_history.json.gz

      - name: Build site
        run: python tools/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
